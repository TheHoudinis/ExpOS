[package]
name = "expos-network-service"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
expos-core = { path = "../../../crates/expos-core", default-features = false }
embedded-io = { version = "0.7", default-features = false }
embedded-tls = { version = "0.19", default-features = false, features = ["rustpki", "p384", "rsa"] }
rand_core = { version = "0.6", default-features = false }

[patch.crates-io]
embedded-tls = { path = "../../../vendor/embedded-tls" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
codegen-units = 1
