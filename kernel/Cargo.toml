[package]
name = "expos-kernel"
version = "9.0.0"
edition = "2021"

# Bare-metal static library: linked together with boot/boot.asm by ld.
[lib]
name = "expos_kernel"
crate-type = ["staticlib"]

[features]
default = []
genesis-installer = []

[dependencies]
argon2 = { version = "0.5.3", default-features = false }
chacha20poly1305 = { version = "0.10.1", default-features = false }
expos-core = { path = "../crates/expos-core" }
embedded-io = { version = "0.7", default-features = false }
embedded-tls = { version = "0.19", default-features = false, features = ["rustpki", "p384", "rsa"] }
linked_list_allocator = "0.10.5"
rand_core = { version = "0.6", default-features = false }
